# Labo 15 : workflow GitHub Actions minimal pour un projet Go.
# Exemple seulement : GitHub ne lit que .github/workflows/ à la RACINE du
# dépôt, ce fichier dans labs/15-release/ n'est donc pas exécuté. Copie-le à
# la racine de ton propre projet.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # la version du go.mod, pas une autre
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Release seulement sur un tag v* : goreleaser construit les archives et
  # crée la GitHub Release avec le jeton fourni par Actions.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # goreleaser a besoin de l'historique pour le changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
